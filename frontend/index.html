<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业机器人关节健康诊断系统</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --bg-card: #112240;
            --bg-input: #0d1b2a;
            --border-glow: #1f6feb;
            --text-primary: #e6f1ff;
            --text-secondary: #8892b0;
            --green: #2ecc71;
            --yellow: #f1c40f;
            --red: #e74c3c;
            --shadow-glow: 0 0 15px rgba(31, 111, 235, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, #1a365d 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, #0f2b5c 0%, transparent 50%);
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), var(--shadow-glow);
            border: 1px solid rgba(31, 111, 235, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(31, 111, 235, 0.8);
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1 1 200px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .input-group input {
            background: var(--bg-input);
            border: 1px solid #1f6feb;
            border-radius: 8px;
            padding: 12px 15px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #63b3ed;
            box-shadow: 0 0 10px rgba(99, 179, 237, 0.6);
        }

        .btn-predict {
            background: linear-gradient(135deg, #1f6feb, #2563eb);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(31, 111, 235, 0.4);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(31, 111, 235, 0.6);
        }

        .btn-predict:active {
            transform: translateY(0);
        }

        .result-panel {
            background: rgba(13, 27, 42, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(31, 111, 235, 0.3);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .light {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #555;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: all 0.5s;
        }

        .light.green {
            background: var(--green);
            box-shadow: 0 0 20px var(--green);
        }

        .light.yellow {
            background: var(--yellow);
            box-shadow: 0 0 20px var(--yellow);
        }

        .light.red {
            background: var(--red);
            box-shadow: 0 0 20px var(--red);
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-text.green { color: var(--green); }
        .status-text.yellow { color: var(--yellow); }
        .status-text.red { color: var(--red); }

        .history-section {
            margin-top: 20px;
        }

        .history-title {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid rgba(31, 111, 235, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(31, 111, 235, 0.2);
        }

        th {
            background: rgba(31, 111, 235, 0.2);
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 1px;
        }

        tr:hover {
            background: rgba(31, 111, 235, 0.1);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-badge.green {
            background: rgba(46, 204, 113, 0.2);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .status-badge.yellow {
            background: rgba(241, 196, 15, 0.2);
            color: var(--yellow);
            border: 1px solid var(--yellow);
        }

        .status-badge.red {
            background: rgba(231, 76, 60, 0.2);
            color: var(--red);
            border: 1px solid var(--red);
        }

        .error-message {
            color: var(--red);
            text-align: center;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .dashboard { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .control-panel { flex-direction: column; align-items: stretch; }
            .btn-predict { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>🛠️ 机器人关节健康诊断系统</h1>

        <div class="control-panel">
            <div class="input-group">
                <label for="vibration">振动值 (mm/s)</label>
                <input type="number" id="vibration" placeholder="0.1 - 10.0" step="0.1" min="0.1" max="10.0" required>
            </div>
            <div class="input-group">
                <label for="temperature">温度 (°C)</label>
                <input type="number" id="temperature" placeholder="20 - 90" step="0.1" min="20" max="90" required>
            </div>
            <button class="btn-predict" id="btnPredict">🔍 预测</button>
        </div>

        <div class="result-panel" id="resultPanel">
            <div class="status-indicator">
                <div class="light" id="statusLight"></div>
                <span class="status-text" id="statusText">-- 等待预测 --</span>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📋 历史记录（最近20条）</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>振动值 (mm/s)</th>
                            <th>温度 (°C)</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr>
                            <td colspan="4" style="text-align:center;">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 后端 API 基础地址（根据实际情况修改）
        const API_BASE = 'http://127.0.0.1:5000';

        // 获取元素
        const vibrationInput = document.getElementById('vibration');
        const temperatureInput = document.getElementById('temperature');
        const btnPredict = document.getElementById('btnPredict');
        const statusLight = document.getElementById('statusLight');
        const statusText = document.getElementById('statusText');
        const historyBody = document.getElementById('historyBody');

        // 根据状态设置指示灯颜色和文字颜色
        function setStatus(status) {
            // 移除所有颜色类
            statusLight.className = 'light';
            statusText.className = 'status-text';

            if (status === '平稳') {
                statusLight.classList.add('green');
                statusText.classList.add('green');
            } else if (status === '轻微抖动') {
                statusLight.classList.add('yellow');
                statusText.classList.add('yellow');
            } else if (status === '严重抖动') {
                statusLight.classList.add('red');
                statusText.classList.add('red');
            } else {
                // 未知状态，保持默认
                statusText.textContent = status;
                return;
            }
            statusText.textContent = status;
        }

        // 加载历史记录
        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/history`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderHistory(data);
            } catch (error) {
                console.error('加载历史记录失败:', error);
                historyBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--red);">无法加载历史记录，请检查后端服务是否启动。</td></tr>`;
            }
        }

        // 渲染历史记录表格
        function renderHistory(records) {
            if (!records || records.length === 0) {
                historyBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">暂无历史记录</td></tr>`;
                return;
            }

            let html = '';
            records.forEach(record => {
                const statusClass = record.status === '平稳' ? 'green' :
                                    record.status === '轻微抖动' ? 'yellow' :
                                    record.status === '严重抖动' ? 'red' : '';
                html += `
                    <tr>
                        <td>${record.timestamp}</td>
                        <td>${record.vibration.toFixed(2)}</td>
                        <td>${record.temperature.toFixed(2)}</td>
                        <td><span class="status-badge ${statusClass}">${record.status}</span></td>
                    </tr>
                `;
            });
            historyBody.innerHTML = html;
        }

        // 执行预测
        async function predict() {
            const vibration = parseFloat(vibrationInput.value);
            const temperature = parseFloat(temperatureInput.value);

            if (isNaN(vibration) || isNaN(temperature)) {
                alert('请输入有效的数值！');
                return;
            }

            // 可选：简单范围校验
            if (vibration < 0.1 || vibration > 10.0) {
                alert('振动值建议在 0.1 - 10.0 mm/s 之间');
                return;
            }
            if (temperature < 20 || temperature > 90) {
                alert('温度建议在 20 - 90 °C 之间');
                return;
            }

            btnPredict.disabled = true;
            btnPredict.textContent = '预测中...';

            try {
                const response = await fetch(`${API_BASE}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ vibration, temperature })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => null);
                    throw new Error(errorData?.error || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                setStatus(data.status);
                // 刷新历史记录
                await loadHistory();
            } catch (error) {
                console.error('预测失败:', error);
                alert(`预测失败：${error.message}`);
            } finally {
                btnPredict.disabled = false;
                btnPredict.textContent = '🔍 预测';
            }
        }

        // 事件监听
        btnPredict.addEventListener('click', predict);
        // 允许回车键触发预测
        [vibrationInput, temperatureInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    predict();
                }
            });
        });

        // 页面加载时自动加载历史记录
        window.addEventListener('load', () => {
            loadHistory();
        });
    </script>
</body>
</html>
